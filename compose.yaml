services:
  format-hub:
    build: .
    ports:
      - "8765:8765"
    environment:
      FORMAT_HUB_TOKEN: ${FORMAT_HUB_TOKEN:-}
      FORMAT_HUB_WORKERS: "2"
      FORMAT_HUB_TIMEOUT: "600"
      FORMAT_HUB_RETENTION_HOURS: "24"
      FORMAT_HUB_MAX_FILE_MB: "200"
    volumes:
      - format-hub-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    mem_limit: 5g
    cpus: 4
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  format-hub-data:
